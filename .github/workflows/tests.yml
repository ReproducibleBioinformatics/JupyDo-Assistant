# Runs the tests (no model, no internet) at every push, with Python 3.9 like the JupyDo hub.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: pip install "tornado>=6.4"
      - run: python -m unittest discover -s tests -t . -v
