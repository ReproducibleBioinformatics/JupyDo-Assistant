# Rebuilds catalog.json (the images the assistant can suggest) every 3 months, and on demand.
# Needs two repository secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a read-only
# Docker Hub access token): without them Docker Hub lists stop at 100 results.
name: catalog

on:
  schedule:
    - cron: "0 3 1 1,4,7,10 *"   # 1 January, April, July, October, 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # GitHub's limit is 6 hours
    steps:
      - uses: actions/checkout@v4
      - name: Build the catalog
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: python3 scripts/make-catalog.py --out catalog.json
      - name: Commit it
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json
          git diff --cached --quiet || git commit -m "catalog: rebuilt $(date -u +%F)"
          git push
